<script>
const pages=[

// ===== Faqja 1: Kopertina =====
{html:`<div class="title-page">
<div class="ar-title">السِّيَاسَةُ الشَّرْعِيَّةُ<br>فِي إِصْلَاحِ الرَّاعِي وَالرَّعِيَّةِ</div>
<div class="divider"></div>
<div class="author-ar">تَأْلِيف<br>شَيْخ الإِسْلَام أَحْمَد بْن عَبْد الحَلِيم بْن عَبْد السَّلَام ابْن تَيْمِيَّة</div>
<div class="author">Shejhul-Islam Ibn Tejmijje (661 — 728 h.)</div>
</div>`},

// ===== Faqja 2: Mukaddimeja (PDF fq. 3) =====
{html:`<span class="bsm">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيمِ</span>
<span class="section-title"><span class="s" data-sq="Suksesi im nuk eshte veçse prej Allahut."><span class="w" data-sq="Suksesi im">وَمَا تَوْفِيقِي</span> <span class="w" data-sq="veçse prej Allahut.">إِلَّا بِاللهِ</span></span></span>

<p><span class="s" data-sq="Falenderimi i takon Allahut, i Cili na i sqaroi shenjat e fese dhe na begatoi me Librin e qarte."><span class="w" data-sq="Falenderimi i takon Allahut,">الحمد لله</span> <span class="w" data-sq="i Cili na i sqaroi shenjat e fese">الذي أوضحَ لنا معالمَ الدين،</span> <span class="w" data-sq="dhe na begatoi me Librin e qarte.">ومنَّ علينا بالكتاب المبين.</span></span> <span class="s" data-sq="Na caktoi dispozita, ndau mes hallallit dhe haramit, me to u percaktuan dobit e krijesave, u vendosen bazat e se vertetes, dhe ua besoi drejtuesve te puneve ate qe me se miri vlerësohet e me se urti administrohet. I takon Atij falenderimi per gjithçka qe caktoi dhe administroi."><span class="w" data-sq="Na caktoi dispozita,">شرع لنا من الأحكام،</span> <span class="w" data-sq="ndau mes hallallit dhe haramit,">وفصَّل بين الحلال والحرام،</span> <span class="w" data-sq="me to u percaktuan dobit e krijesave,">فتقدَّرت به مصالح الخلق،</span> <span class="w" data-sq="u vendosen bazat e se vertetes,">وثبتت به قواعد الحق،</span> <span class="w" data-sq="dhe ua besoi drejtuesve te puneve ate qe me se miri vlerësohet e me se urti administrohet.">ووكل إلىٰ ولاة الأمور ما أحسن فيه التقدير وأحكم به التدبير،</span> <span class="w" data-sq="I takon Atij falenderimi per gjithçka qe caktoi dhe administroi.">فله الحمد علىٰ ما قدَّر ودبَّر.</span></span></p>

<p><span class="s" data-sq="Deshmoj se nuk ka te adhuruar me te drejte perveç Allahut, te Vetëm, pa ortak. I dergoi te derguarit e Tij me prova te qarta dhe zbriti me ta Librin dhe Peshoren, qe njerezit te vendosin drejtesine."><span class="w" data-sq="Deshmoj se nuk ka te adhuruar me te drejte perveç Allahut, te Vetëm, pa ortak.">وأشهد أن لا إله إلا الله وحده لا شريك له،</span> <span class="w" data-sq="I dergoi te derguarit e Tij me prova te qarta">أرسل رسله بالبينات</span> <span class="w" data-sq="dhe zbriti me ta Librin dhe Peshoren,">وأنزل معهم الكتاب والميزان</span> <span class="w" data-sq="qe njerezit te vendosin drejtesine.">ليقوم الناس بالقسط.</span></span> <span class="s quran" data-sq="Ne e kemi zbritur edhe hekurin që në të ka forcë të fortë dhe dobi për njerëz, e edhe për t'u ditur te All-llahu se kush ndihmon Atë (rrugën e Tij) dhe të dërguarit e Tij duke i besuar të fshehtës. S'ka dyshim se All-llahu është furnizues, mbizotërues. [El-Hadid: 25]"><span class="w" data-sq="Ne e kemi zbritur edhe hekurin që në të ka forcë të fortë dhe dobi për njerëz,">﴿وَأَنزَلْنَا الْحَدِيدَ فِيهِ بَأْسٌ شَدِيدٌ وَمَنَافِعُ لِلنَّاسِ</span> <span class="w" data-sq="e edhe për t'u ditur te All-llahu se kush ndihmon Atë (rrugën e Tij) dhe të dërguarit e Tij duke i besuar të fshehtës.">وَلِيَعْلَمَ اللَّهُ مَن يَنصُرُهُ وَرُسُلَهُ بِالْغَيْبِ</span> <span class="w" data-sq="S'ka dyshim se All-llahu është furnizues, mbizotërues.">إِنَّ اللَّهَ قَوِيٌّ عَزِيزٌ﴾</span> [الحديد: ٢٥].</span></p>

<p><span class="s" data-sq="Dhe i vulosi ata me Muhamedin, Pejgamberin tone ﷺ, te cilin e dergoi me Udhezimin dhe fene e vertete per ta bere mbizoteruese mbi çdo fe tjeter, dhe e perforçoi me pushtetin ndihmës — qe bashkon kuptimin e dijes dhe penes per udhezim e prove, me kuptimin e fuqise dhe shpates per fitore e ndeshkim."><span class="w" data-sq="Dhe i vulosi ata me Muhamedin, Pejgamberin tone ﷺ,">وختمهم بمحمد نبينا ﷺ</span> <span class="w" data-sq="te cilin e dergoi me Udhezimin dhe fene e vertete per ta bere mbizoteruese mbi çdo fe tjeter,">الذي أرسله بالهدىٰ ودين الحق ليظهره علىٰ الدين كله</span> <span class="w" data-sq="dhe e perforçoi me pushtetin ndihmës —">وأيَّده بالسلطان النصير،</span> <span class="w" data-sq="qe bashkon kuptimin e dijes dhe penes per udhezim e prove,">الجامع معنىٰ العلم والقلم للهداية والحجة</span> <span class="w" data-sq="me kuptimin e fuqise dhe shpates per fitore e ndeshkim.">ومعنىٰ القدرة والسيف للنُّصْرَة والتعزير.</span></span></p>`},

// ===== Faqja 3: (PDF fq. 4) =====
{html:`<p><span class="s" data-sq="Me pas: Ky eshte nje traktat qe permbledh parime gjitheperfshirese nga politika hyjnore dhe qeverisja profetike, nga e cila nuk ben pa as bariu as grigia."><span class="w" data-sq="Me pas:">وبعد؛</span> <span class="w" data-sq="Ky eshte nje traktat qe permbledh parime gjitheperfshirese nga politika hyjnore dhe qeverisja profetike,">فهذه رسالة تتضمَّن جوامعَ من السياسة الإلهية والإيالة النبوية،</span> <span class="w" data-sq="nga e cila nuk ben pa as bariu as grigia.">لا يستغني عنها الراعي والرعية.</span></span> <span class="s" data-sq="E kerkoi ajo ndaj atyre qe Allahu e obligoi keshillimin e tyre nga drejtuesit e puneve, siç tha Pejgamberi ﷺ — ne ate qe eshte vertetuar prej tij nga shume rruge transmetimi —:"><span class="w" data-sq="E kerkoi ajo ndaj atyre qe Allahu e obligoi keshillimin e tyre nga drejtuesit e puneve,">اقتضاها من أوجبَ الله نُصْحَه من ولاة الأمور،</span> <span class="w" data-sq="siç tha Pejgamberi ﷺ — ne ate qe eshte vertetuar prej tij nga shume rruge transmetimi —:">كما قال النبي ﷺ ـ فيما ثبت عنه من غير وجه ـ:</span></span></p>

<p><span class="s hadith" data-sq="«Vertet, Allahu kenaqet per ju me tre gjera: ta adhuroni Ate e te mos i shoqeroni Atij asgje, te kapeni te gjithe bashkerisht per litarin e Allahut e te mos u perçani, dhe t'i keshilloni sinqerisht ata qe Allahu i ka vene drejtues mbi ju.»"><span class="w" data-sq="«Vertet, Allahu kenaqet per ju me tre gjera:">«إن الله يرضىٰ لكم ثلاثًا:</span> <span class="w" data-sq="ta adhuroni Ate e te mos i shoqeroni Atij asgje,">أن تعبدوه ولا تشركوا به شيئًا،</span> <span class="w" data-sq="te kapeni te gjithe bashkerisht per litarin e Allahut e te mos u perçani,">وأن تعتصموا بحبل الله جميعًا ولا تفرقوا،</span> <span class="w" data-sq="dhe t'i keshilloni sinqerisht ata qe Allahu i ka vene drejtues mbi ju.»">وأن تُناصحوا من ولَّاه الله أمركم».</span></span></p>

<p><span class="s" data-sq="Ky traktat eshte i ndertuar mbi ajetin e udheheqesve ne Librin e Allahut, qe eshte fjala e Te Lartit:"><span class="w" data-sq="Ky traktat eshte i ndertuar mbi ajetin e udheheqesve ne Librin e Allahut,">وهذه رسالةٌ مبنية علىٰ آية الأمراء في كتاب الله</span> <span class="w" data-sq="qe eshte fjala e Te Lartit:">وهي قوله تعالىٰ:</span></span></p>`},

// ===== Faqja 4: Ajetet En-Nisa (PDF fq. 5) =====
{html:`<p><span class="s quran" data-sq="All-llahu ju urdhëron që t'u jepni amanetin të zotëve të tyre dhe kur të gjykoni, ju urdhëron të gjykoni me të drejt mes njerëzve. Sa e mirë është kjo që ju këshillon. All-llahu dëgjon dhe sheh si veproni."><span class="w" data-sq="All-llahu ju urdhëron që t'u jepni amanetin të zotëve të tyre">﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا</span> <span class="w" data-sq="dhe kur të gjykoni, ju urdhëron të gjykoni me të drejt mes njerëzve.">وَإِذَا حَكَمْتُم بَيْنَ النَّاسِ أَن تَحْكُمُوا بِالْعَدْلِ</span> <span class="w" data-sq="Sa e mirë është kjo që ju këshillon.">إِنَّ اللَّهَ نِعِمَّا يَعِظُكُم بِهِ</span> <span class="w" data-sq="All-llahu dëgjon dhe sheh si veproni.">إِنَّ اللَّهَ كَانَ سَمِيعًا بَصِيرًا﴾</span></span></p>

<p><span class="s quran" data-sq="O ju që besuat, bindjuni All-llahut, respektoni të dërguarin dhe përgjegjësit nga ju. Nëse nuk pajtoheni për ndonjë çështje, atëherë parashtrojeni atë te All-llahu (te libri i Tij) dhe te i dërguar, po qe se i besoni All-llahut dhe ditës së fundit. Kjo është më e dobishmja dhe përfundimi më i mirë. [En-Nisa: 58-59]"><span class="w" data-sq="O ju që besuat, bindjuni All-llahut, respektoni të dërguarin dhe përgjegjësit nga ju.">يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ وَأُولِي الْأَمْرِ مِنكُمْ</span> <span class="w" data-sq="Nëse nuk pajtoheni për ndonjë çështje, parashtrojeni atë te All-llahu dhe te i dërguar,">فَإِن تَنَازَعْتُمْ فِي شَيْءٍ فَرُدُّوهُ إِلَى اللَّهِ وَالرَّسُولِ</span> <span class="w" data-sq="po qe se i besoni All-llahut dhe ditës së fundit.">إِن كُنتُمْ تُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ</span> <span class="w" data-sq="Kjo është më e dobishmja dhe përfundimi më i mirë.">ذَٰلِكَ خَيْرٌ وَأَحْسَنُ تَأْوِيلًا﴾</span> [النساء: ٥٨-٥٩].</span></p>

<p><span class="s" data-sq="Dijetaret thane: Ajeti i pare zbriti per drejtuesit e puneve — mbi ta eshte t'ua dorezojne amanetet atyre qe u takojne, dhe kur gjykojne mes njerezve, te gjykojne me drejtesi. Ajeti i dyte zbriti per grigjen, nga ushtrite e te tjeret — mbi ta eshte bindja ndaj udheheqesve qe e zbatojne kete, ne ndarjet, gjykimet, fushatat e gjera te tjera, perveçse kur urdherojne ne mosbindje ndaj Allahut te Lartesuar."><span class="w" data-sq="Dijetaret thane:">قال العلماء:</span> <span class="w" data-sq="Ajeti i pare zbriti per drejtuesit e puneve —">نزلت الآية الأولىٰ في ولاة الأمور،</span> <span class="w" data-sq="mbi ta eshte t'ua dorezojne amanetet atyre qe u takojne,">عليهم أن يؤدوا الأمانات إلىٰ أهلها</span> <span class="w" data-sq="dhe kur gjykojne mes njerezve, te gjykojne me drejtesi.">وإذا حكموا بين الناس أن يحكموا بالعدل،</span> <span class="w" data-sq="Ajeti i dyte zbriti per grigjen, nga ushtrite e te tjeret —">ونزلت الثانية في الرعية من الجيوش وغيرهم،</span> <span class="w" data-sq="mbi ta eshte bindja ndaj udheheqesve qe e zbatojne kete, ne ndarjet, gjykimet, fushatat e gjera te tjera,">عليهم طاعة أولي الأمر الفاعلين لذلك في قَسْمهم وحُكْمهم ومغازيهم وغير ذلك،</span> <span class="w" data-sq="perveçse kur urdherojne ne mosbindje ndaj Allahut te Lartesuar.">إلا أن يأمروا بمعصية الله عز وجل.</span></span></p>

<p><span class="s" data-sq="Nese urdherojne ne mosbindje ndaj Allahut te Lartesuar, nuk ka bindje ndaj krijesës ne mosbindje ndaj Krijuesit. Nese grindeni per diçka, kthejeni ate te Libri i Allahut dhe Suneti i te Derguarit te Tij ﷺ."><span class="w" data-sq="Nese urdherojne ne mosbindje ndaj Allahut, nuk ka bindje ndaj krijesës ne mosbindje ndaj Krijuesit.">فإذا أمروا بمعصية الله عز وجل فلا طاعة لمخلوق في معصية الخالق،</span> <span class="w" data-sq="Nese grindeni per diçka, kthejeni ate te Libri i Allahut dhe Suneti i te Derguarit te Tij ﷺ.">فإن تنازعوا في شيء ردوه إلىٰ كتاب الله وسنة رسوله ﷺ.</span></span></p>

<p><span class="s" data-sq="Edhe nese drejtuesit e puneve nuk e bejne kete, atyre u bindeni ne ate qe urdherojne nga bindja ndaj Allahut — ngase kjo eshte bindje ndaj Allahut dhe te Derguarit te Tij — dhe u jepen te drejtat e tyre siç ka urdheruar Allahu dhe i Derguari i Tij, ndihmohen ne miresi e devotshmeri, dhe nuk ndihmohen ne mekat e tejkalim."><span class="w" data-sq="Edhe nese drejtuesit nuk e bejne kete, atyre u bindeni ne ate qe urdherojne nga bindja ndaj Allahut —">وإن لم تفعل ولاةُ الأمر ذلك أُطيعوا فيما يأمرون به من طاعة الله؛</span> <span class="w" data-sq="ngase kjo eshte bindje ndaj Allahut dhe te Derguarit te Tij —">لأن ذلك من طاعة الله ورسوله،</span> <span class="w" data-sq="dhe u jepen te drejtat e tyre siç ka urdheruar Allahu dhe i Derguari i Tij,">وأُدِّيَت حقوقُهم إليهم كما أمر الله ورسوله،</span> <span class="w" data-sq="ndihmohen ne miresi e devotshmeri,">وأُعينوا علىٰ البر والتقوىٰ،</span> <span class="w" data-sq="dhe nuk ndihmohen ne mekat e tejkalim.">ولا يُعَانون علىٰ الإثم والعدوان.</span></span></p>

<p><span class="s" data-sq="Nese ajeti ka obliguar dorezimin e amaneteve pronareve te tyre, dhe gjykimin me drejtesi, keto te dyja jane thelbi i politikes se drejte dhe qeverisjes se mire."><span class="w" data-sq="Nese ajeti ka obliguar dorezimin e amaneteve pronareve te tyre, dhe gjykimin me drejtesi,">وإذا كانت الآية قد أوجبت أداء الأمانات إلىٰ أهلها، والحكم بالعدل،</span> <span class="w" data-sq="keto te dyja jane thelbi i politikes se drejte dhe qeverisjes se mire.">فهذان جِماع السياسة العادلة، والولاية الصالحة.</span></span></p>`},

// ===== Faqja 5: Fasl — Amanetet (PDF fq. 6) =====
{html:`<span class="fasl">فصل</span>
<p><span class="s" data-sq="Sa i perket dorezimit te amaneteve, ai ka dy lloje:"><span class="w" data-sq="Sa i perket dorezimit te amaneteve,">أما أداء الأمانات</span> <span class="w" data-sq="ai ka dy lloje:">ففيه نوعان:</span></span></p>

<p><span class="s" data-sq="E para: Vilajetet (postet drejtuese), dhe kjo ishte shkaku i zbritjes se ajetit."><span class="w" data-sq="E para: Vilajetet (postet drejtuese),">أحدهما: الولايات،</span> <span class="w" data-sq="dhe kjo ishte shkaku i zbritjes se ajetit.">وهو كان سبب نزول الآية.</span></span></p>

<p><span class="s" data-sq="Pejgamberi ﷺ kur çliroi Meken dhe mori çelesat e Qabes nga Benu Shejbe, ia kerkoi atij Abasi qe t'ia bashkonte ujitjen e haxhilereve me rojtarllekun e Shtepise, e Allahu e zbriti kete ajet, dhe ia ktheu çelesat e Qabes Benu Shejbes."><span class="w" data-sq="Pejgamberi ﷺ kur çliroi Meken dhe mori çelesat e Qabes nga Benu Shejbe,">فإن النبي ﷺ لما فتح مكة وتسلَّم مفاتيح الكعبة من بني شيبة،</span> <span class="w" data-sq="ia kerkoi atij Abasi qe t'ia bashkonte ujitjen e haxhilereve me rojtarllekun e Shtepise,">طلبها منه العباس ليجمع له بين سقاية الحاج وسِدانة البيت،</span> <span class="w" data-sq="e Allahu e zbriti kete ajet, dhe ia ktheu çelesat e Qabes Benu Shejbes.">فأنزل الله هذه الآية، فدفع مفاتيح الكعبة إلىٰ بني شيبة.</span></span></p>

<p><span class="s" data-sq="Eshte obligim mbi drejtuesin e puneve qe te emeroje mbi çdo pune te muslimaneve me te pershtatshmin qe gjen per ate pune."><span class="w" data-sq="Eshte obligim mbi drejtuesin e puneve">فيجب على وليِّ الأمر</span> <span class="w" data-sq="qe te emeroje mbi çdo pune te muslimaneve me te pershtatshmin qe gjen per ate pune.">أن يولِّي على كل عمل من أعمال المسلمين أصلح من يجده لذلك العمل.</span></span> <span class="s hadith" data-sq="Tha Pejgamberi ﷺ: «Kush merr persiper diçka nga punet e muslimaneve, e emeron nje njeri nderkohe qe gjen me te pershtatshmin per muslimanet se ai, ka tradhetuar Allahun, te Derguarin e Tij dhe besimtaret.» — e transmetoi Hakimi ne 'Sahihun' e tij."><span class="w" data-sq="Tha Pejgamberi ﷺ:">قال النبي ﷺ:</span> <span class="w" data-sq="«Kush merr persiper diçka nga punet e muslimaneve, e emeron nje njeri nderkohe qe gjen me te pershtatshmin per muslimanet se ai, ka tradhetuar Allahun, te Derguarin e Tij dhe besimtaret.»">«من وَلِيَ من أمر المسلمين شيئًا، فولَّىٰ رجلًا وهو يجد من هو أصلحُ للمسلمين منه، فقد خان الله ورسوله وخان المؤمنين»</span> <span class="w" data-sq="e transmetoi Hakimi ne 'Sahihun' e tij.">رواه الحاكم في «صحيحه».</span></span></p>`},

// ===== Faqja 6: (PDF fq. 7) =====
{html:`<p><span class="s hadith" data-sq="Dhe ne nje transmetim tjeter: «Kush i ngarkon nje njeriu nje pune mbi nje grup, nderkohe qe ne ate grup gjen me te kenaqshmin se ai, ka tradhetuar Allahun, te Derguarin e Tij dhe besimtaret.»"><span class="w" data-sq="Dhe ne nje transmetim tjeter:">وفي رواية:</span> <span class="w" data-sq="«Kush i ngarkon nje njeriu nje pune mbi nje grup, nderkohe qe ne ate grup gjen me te kenaqshmin se ai, ka tradhetuar Allahun, te Derguarin e Tij dhe besimtaret.»">«مَن قلَّدَ رجلًا عملًا على عصابة وهو يجد في تلك العصابة أرضىٰ منه فقد خان الله ورسوله وخان المؤمنين».</span></span></p>

<p><span class="s" data-sq="Dhe tha Umer ibnu'l-Hatabi, Allahu qofte i kenaqur me te: Kush merr persiper diçka nga punet e muslimaneve e emeron nje njeri per shkak dashurie apo farefisnise mes tyre, ka tradhetuar Allahun, te Derguarin e Tij dhe muslimanet."><span class="w" data-sq="Dhe tha Umer ibnu'l-Hatabi, Allahu qofte i kenaqur me te:">وقال عمر بن الخطاب رضي الله عنه:</span> <span class="w" data-sq="Kush merr persiper diçka nga punet e muslimaneve e emeron nje njeri per shkak dashurie apo farefisnise mes tyre, ka tradhetuar Allahun, te Derguarin e Tij dhe muslimanet.">من وَلِيَ من أمر المسلمين شيئًا فولَّىٰ رجلًا لمودة أو قرابة بينهما، فقد خان الله ورسوله والمسلمين.</span></span></p>

<p><span class="s" data-sq="Kjo eshte obligim mbi te, andaj mbi te eshte kerkimi i merituesve per postet — nga zevendesit e tij ne qytete: emiret qe jane zevendes te sulltanit, gjyqtaret e te ngjashmit, komandantet e ushtrive, komandantet e brigadave te medha e te vogla, drejtuesit e pasurive: nga veziret, shkruesit, mbikqyresit dhe mbledhesit e tatimeve"><span class="w" data-sq="Kjo eshte obligim mbi te, andaj mbi te eshte kerkimi i merituesve per postet —">وهذا واجبٌ عليه، فيجب عليه البحث عن المستحقين للولايات</span> <span class="w" data-sq="nga zevendesit e tij ne qytete: emiret qe jane zevendes te sulltanit, gjyqtaret e te ngjashmit,">من نوّابه على الأمصار، من الأمراء الذين هم نُوَّاب ذي السلطنة، والقضاة ونحوهم،</span> <span class="w" data-sq="komandantet e ushtrive, komandantet e brigadave te medha e te vogla,">ومن أمراء الأجناد ومُقدَّمي العساكر الكبار والصغار،</span> <span class="w" data-sq="drejtuesit e pasurive: nga veziret, shkruesit, mbikqyresit dhe mbledhesit e tatimeve">وولاة الأموال؛ من الوزراء والكتَّاب والشادِّين والسعاة على الخراج</span></span></p>`},

// ===== Faqja 7: (PDF fq. 8) =====
{html:`<p><span class="s" data-sq="dhe sadakave, e pasurive te tjera qe u takojne muslimaneve."><span class="w" data-sq="dhe sadakave, e pasurive te tjera qe u takojne muslimaneve.">والصدقات، وغير ذلك من الأموال التي للمسلمين.</span></span></p>

<p><span class="s" data-sq="Mbi çdo njerin nga keta eshte te zevendesoje e te punesoje me te pershtatshmin qe gjen; e kjo arrin deri te imamet e namazit, muezinet, lexuesit e Kuranit, muesuesit, komandantet e haxhit, postierët, spiunet — qe jane lajmetaret — rojtaret e pasurive, rojtaret e kshtjellave, portierët — qe jane rojtaret e portave ne kshtjella e qytete — kryetaret e brigadave te medha e te vogla, kryetaret e fiseve e tregjeve, dhe drejtuesit e fshatrave."><span class="w" data-sq="Mbi çdo njerin nga keta eshte te zevendesoje e te punesoje me te pershtatshmin qe gjen;"> وعلى كل واحد من هؤلاء أن يستنيب ويستعمل أصلح مَن يجده،</span> <span class="w" data-sq="e kjo arrin deri te imamet e namazit, muezinet, lexuesit, muesuesit, komandantet e haxhit, postierët, spiunet, rojtaret e pasurive,">وينتهي ذلك إلىٰ أئمة الصلاة، والمؤذنين، والمقرئين، والمعلمين، وأمراء الحاج، والبُرُد، والعيون ـ الذين هم القصاد ـ وخُزَّان الأموال،</span> <span class="w" data-sq="rojtaret e kshtjellave, portierët, kryetaret e brigadave, kryetaret e fiseve e tregjeve, drejtuesit e fshatrave.">وحُرَّاس الحصون، والحدَّادين ـ الذين هم البوَّابون على الحصون والمدائن ـ ونُقَباء العساكر الكبار والصغار، وعُرَفاء القبائل والأسواق، ورؤساء القرىٰ ـ الذين هم الدهاقين ـ.</span></span></p>

<p><span class="s" data-sq="Eshte obligim mbi çdokend qe merr persiper diçka nga punet e muslimaneve, nga keta e te tjere, te punesoje ne çdo pozite me te pershtatshmin qe mundet, dhe te mos e parapelqeje njeriun ngase e ka kerkuar postin apo ka nxituar ne kerkim, perkundrazi, kjo eshte shkak per ta ndaluar."><span class="w" data-sq="Eshte obligim mbi çdokend qe merr persiper diçka nga punet e muslimaneve te punesoje ne çdo pozite me te pershtatshmin qe mundet,">فيجب على كل مَن وَلِيَ شيئًا من أمر المسلمين، من هؤلاء وغيرهم أن يستعمل فيما تحت يده في كل موضع أصلح مَن يقدر عليه،</span> <span class="w" data-sq="dhe te mos e parapelqeje njeriun ngase e ka kerkuar postin apo ka nxituar ne kerkim, perkundrazi, kjo eshte shkak per ta ndaluar.">ولا يقدم الرجل لكونه طلبَ الولاية، أو سبق في الطلب، بل ذلك سبب المنع.</span></span></p>

<p><span class="s hadith" data-sq="Ne 'Dy Sahihet' transmetohet nga Pejgamberi ﷺ: qe nje grup hyne tek ai e i kerkuan post, e ai tha: «Nuk ua japim kete punen tone atij qe e kerkon.»"><span class="w" data-sq="Ne 'Dy Sahihet' transmetohet nga Pejgamberi ﷺ:">فإن في «الصحيحين» عن النبي ﷺ:</span> <span class="w" data-sq="qe nje grup hyne tek ai e i kerkuan post, e ai tha: «Nuk ua japim kete punen tone atij qe e kerkon.»">أن قومًا دخلوا عليه فسألوه ولاية، فقال: «لا نولِّي أمرنا هذا مَن طلبه».</span></span></p>`},

// ===== Faqja 8: (PDF fq. 9) =====
{html:`<p><span class="s hadith" data-sq="Dhe i tha Abdurrahman ibnu Semures: «O Abdurrahman, mos e kerko emiratin, sepse nese te jepet pa e kerkuar, do te ndihmohesh ne te; e nese te jepet duke e kerkuar, do te lihesh vetem me te.» — e nxoren te dy ne 'Sahihet'."><span class="w" data-sq="Dhe i tha Abdurrahman ibnu Semures:">وقال لعبد الرحمن بن سَمُرَة:</span> <span class="w" data-sq="«O Abdurrahman, mos e kerko emiratin, sepse nese te jepet pa e kerkuar, do te ndihmohesh ne te; e nese te jepet duke e kerkuar, do te lihesh vetem me te.»">«يا عبد الرحمن، لا تسأل الإمارة، فإنك إن أُعطيتَها من غير مسألة أُعِنْتَ عليها، وإن أُعطيتَها عن مسألة وُكِلْتَ إليها»</span> <span class="w" data-sq="e nxoren te dy ne 'Sahihet'.">أخرجاه في «الصحيحين».</span></span></p>

<p><span class="s hadith" data-sq="Dhe tha ﷺ: «Kush e kerkoi gjykimin dhe kerkoi ndihme per te, i lihet vetem atij; e kush nuk e kerkoi gjykimin e as nuk kerkoi ndihme per te, Allahu i zbret nje engjell qe e drejton.» — e transmetuan autoret e Suneneve."><span class="w" data-sq="Dhe tha ﷺ:">وقال ﷺ:</span> <span class="w" data-sq="«Kush e kerkoi gjykimin dhe kerkoi ndihme per te, i lihet vetem atij; e kush nuk e kerkoi gjykimin e as nuk kerkoi ndihme per te, Allahu i zbret nje engjell qe e drejton.»">«مَن طلبَ القضاءَ واستعانَ عليه وُكِلَ إليه، ومَن لم يطلب القضاءَ ولم يستعنْ عليه، أنزل الله إليه مَلَكًا يُسَدِّدُه»</span> <span class="w" data-sq="e transmetuan autoret e Suneneve.">رواه أهل السنن.</span></span></p>

<p><span class="s" data-sq="Nese largohet nga me i merituari e me i pershtatshmi dhe zgjedh nje tjeter — per shkak farefisnise, miqesise, pajtimtarise ne vend, medh'heb, rruge apo race si arabishta, persishta, turqishta apo romake, apo per ryshfet qe e merr prej tij ne pasuri, dobi a tjeter gje —"><span class="w" data-sq="Nese largohet nga me i merituari e me i pershtatshmi dhe zgjedh nje tjeter —">فإن عدل عن الأحقِّ الأصلح إلىٰ غيره،</span> <span class="w" data-sq="per shkak farefisnise, miqesise, pajtimtarise ne vend, medh'heb, rruge apo race si arabishta, persishta, turqishta apo romake,">لأجل قرابة بينهما أو ولاء عتاقة، أو صداقة، أو موافقة في بلد أو مذهب أو طريقة أو جنس، كالعربية والفارسية والتركية والرومية،</span> <span class="w" data-sq="apo per ryshfet qe e merr prej tij ne pasuri, dobi a tjeter gje —">أو لرشوة يأخذها منه من مال أو منفعة أو غير</span></span></p>`},

// ===== Faqja 9: (PDF fq. 10) =====
{html:`<p><span class="s" data-sq="ate nga shkaqet, apo per urrëjtje ne zemren e tij ndaj me te merituarit, apo per armiqesi mes tyre — ka tradhetuar Allahun, te Derguarin e Tij dhe besimtaret, dhe ka hyre ne ate qe eshte ndaluar ne fjalen e Te Lartit:"><span class="w" data-sq="ate nga shkaqet, apo per urrëjtje ne zemren e tij ndaj me te merituarit, apo per armiqesi mes tyre —">ذلك من الأسباب، أو لِضِغَنٍ في قلبه على الأحق، أو عداوة بينهما=</span> <span class="w" data-sq="ka tradhetuar Allahun, te Derguarin e Tij dhe besimtaret,">فقد خان الله ورسوله والمؤمنين،</span> <span class="w" data-sq="dhe ka hyre ne ate qe eshte ndaluar ne fjalen e Te Lartit:">ودخل فيما نُهي عنه في قوله تعالىٰ:</span></span></p>

<p><span class="s quran" data-sq="O ju që besuat, mos e tradhtoni All-llahun dhe të dërguarin, e ashtu të tradhtoni amanetet tuaja, derisa e dini sa e keqe është kjo. Pastaj tha: Dhe, dijeni se pasuria e juaj dhe fëmijët tuaj janë vetëm një sprovë, dhe se te All-llahu është shpërblimi i madh. [El-Enfal: 27-28]"><span class="w" data-sq="O ju që besuat, mos e tradhtoni All-llahun dhe të dërguarin, e ashtu të tradhtoni amanetet tuaja, derisa e dini sa e keqe është kjo.">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَخُونُوا اللَّهَ وَالرَّسُولَ وَتَخُونُوا أَمَانَاتِكُمْ﴾</span> <span class="w" data-sq="Dhe, dijeni se pasuria e juaj dhe fëmijët tuaj janë vetëm një sprovë, dhe se te All-llahu është shpërblimi i madh.">﴿وَاعْلَمُوا أَنَّمَا أَمْوَالُكُمْ وَأَوْلَادُكُمْ فِتْنَةٌ وَأَنَّ اللَّهَ عِندَهُ أَجْرٌ عَظِيمٌ﴾</span> [الأنفال: ٢٧-٢٨].</span></p>

<p><span class="s" data-sq="Njeriu, per shkak dashurise ndaj femijës apo te lirueshmit te tij, mund ta parapelqeje ne disa poste, apo t'i jape ate qe nuk e meriton, e keshtu ka tradhetuar amanetin e tij. Gjithashtu mund te parapelqeje shtimin e pasurise se vet apo mbrojtjen e saj duke marre ate qe nuk e meriton, apo duke favorizuar kend i lajkaton ne disa poste, e keshtu ka tradhetuar Allahun, te Derguarin dhe amanetin e tij."><span class="w" data-sq="Njeriu, per shkak dashurise ndaj femijës apo te lirueshmit, mund ta parapelqeje ne disa poste, apo t'i jape ate qe nuk e meriton, e keshtu ka tradhetuar amanetin.">فإن الرجل لحبه لولده أو لعتيقه، قد يؤثره في بعض الولايات، أو يعطيه ما لا يستحقه، فيكون قد خان أمانته،</span> <span class="w" data-sq="Gjithashtu mund te parapelqeje shtimin e pasurise se vet, apo favorizimin e kujt i lajkaton, e keshtu ka tradhetuar Allahun, te Derguarin dhe amanetin.">وكذلك قد يؤثر زيادة ماله أو حفظه ما لا يستحقه، أو محاباة من يداهنه في بعض الولايات، فيكون قد خان الله والرسول وأمانته.</span></span></p>

<p><span class="s" data-sq="Ai qe e dorezoi amanetin — duke kundershtuar deshiren e vet — Allahu e shperblen duke ia ruajtur familjen e pasurine pas tij. Kurse ai qe i bindet deshires se vet, Allahu e ndeshkon me te kunderten e qellimit te tij: ia poshteron familjen dhe ia humbet pasurine."><span class="w" data-sq="Ai qe e dorezoi amanetin duke kundershtuar deshiren e vet — Allahu e shperblen duke ia ruajtur familjen e pasurine pas tij.">ثم إن المؤدي للأمانة ـ مع مخالفة هواه ـ يُثِيبُه الله فيحفظه في أهله وماله بعده.</span> <span class="w" data-sq="Kurse ai qe i bindet deshires se vet, Allahu e ndeshkon me te kunderten e qellimit: ia poshteron familjen dhe ia humbet pasurine.">والمطيع لهواه يعاقبه الله بنقيض قصده فيُذِلُّ أهلَه ويُذهِب مالَه.</span></span></p>`},

// ===== Faqja 10: Tregimi i Umer ibnu Abdulazizit (PDF fq. 10-11) =====
{html:`<p><span class="s" data-sq="Ne kete ka nje tregim te njohur: se njeri nga halifet e Benu Abasit e pyeti njerin nga dijetaret t'i tregonte nga ajo qe kishte arritur. Ai tha: E kam arritur Umer ibnu Abdulazizin, te cilit i thane: O emiri i besimtareve, ua ke zbrazur gojën femijeve tu nga kjo pasuri, e i ke lene te varfer pa asgje — e ai ishte ne semundjen e vdekjes. Tha: Futini te me. — E i futen, e ishin rreth pese a me shume djem, asnje i rritur. Kur i pa, i rrodhen syte, pastaj tha:"><span class="w" data-sq="Ne kete ka nje tregim te njohur:">وفي ذلك الحكاية المشهورة:</span> <span class="w" data-sq="se njeri nga halifet e Benu Abasit e pyeti njerin nga dijetaret t'i tregonte nga ajo qe kishte arritur. Ai tha: E kam arritur Umer ibnu Abdulazizin,">أن بعض خلفاء بني العباس سأل بعض العلماء أن يحدثه عن بعض ما أدرك، فقال: أدركت عمر بن عبد العزيز</span> <span class="w" data-sq="te cilit i thane: O emiri i besimtareve, ua ke zbrazur gojën femijeve tu nga kjo pasuri, e i ke lene te varfer pa asgje — e ai ishte ne semundjen e vdekjes.">وقد قيل له: يا أمير المؤمنين أفرغت أفواه بنيك من هذا المال، وتركتهم فقراء لا شيء لهم ـ وكان في مرض موته ـ</span> <span class="w" data-sq="Tha: Futini te me. — E i futen, e ishin rreth pese a me shume djem, asnje i rritur.">فقال: أدخلوهم عليّ، فأدخلوهم ـ وهم بضعة عشر ذكرًا ليس فيهم بالغ ـ</span> <span class="w" data-sq="Kur i pa, i rrodhen syte, pastaj tha:">فلما رآهم ذرفت عيناه، ثم قال:</span></span></p>

<p><span class="s hadith" data-sq="«O bijet e mi! Per Allahun, nuk ju kam ndaluar nje te drejte qe ishte e juaja, e nuk kam qene ai qe merr pasurite e njerezve e t'jua jap juve. Ju jeni njeri nga dy: ose i mire — e Allahu kujdeset per te miret — ose jo i mire — e nuk i le atij ate qe do ta ndihmonte ne mosbindjen ndaj Allahut. Ngrihuni nga une.»"><span class="w" data-sq="O bijet e mi! Per Allahun, nuk ju kam ndaluar nje te drejte qe ishte e juaja, e nuk kam qene ai qe merr pasurite e njerezve e t'jua jap juve.">يا بَنِيَّ والله ما منعتكم حقًّا هو لكم، ولم أكن بالذي آخذ أموال الناس فأدفعها إليكم،</span> <span class="w" data-sq="Ju jeni njeri nga dy: ose i mire — e Allahu kujdeset per te miret — ose jo i mire — e nuk i le atij ate qe do ta ndihmonte ne mosbindjen ndaj Allahut. Ngrihuni nga une.">وإنما أنتم أحد رجلين: إما صالح فالله يتولَّىٰ الصالحين، وإما غير صالح فلا أخلِّف له ما يستعين به على معصية الله، قوموا عني.</span></span></p>

<p><span class="s" data-sq="Tha (transmetuesi): E kam pare njerin nga bijet e tij qe ka bartur njëqind kuaj ne rrugen e Allahut — dmth: ua dha atyre qe luftonin me ta."><span class="w" data-sq="E kam pare njerin nga bijet e tij qe ka bartur njëqind kuaj ne rrugen e Allahut — ua dha atyre qe luftonin me ta.">قال: فلقد رأيت بعض ولده حمَّل على مئة فرس في سبيل الله. يعني: أعطاها لمن يغزو عليها.</span></span></p>

<p><span class="s" data-sq="Them: Ky ishte halifja i muslimaneve nga lindja me e larget ne tokat turke deri ne perendimin me te larget ne Andaluzi e gjetiu, nga ishulli i Qipros e kufijte e Shamit e kshtjellat si Tarsusi e te ngjashmet deri ne skajin e Jemenit. E çdo femije i tij nuk mori nga pasuria e tij perveçse pak — thuhet: me pak se njëzet dirhem."><span class="w" data-sq="Them: Ky ishte halifja i muslimaneve nga lindja me e larget ne tokat turke deri ne perendimin me te larget ne Andaluzi,">قلت: هذا وقد كان خليفة المسلمين من أقصىٰ المشرق ببلاد الترك إلىٰ أقصىٰ المغرب بالأندلس وغيرها،</span> <span class="w" data-sq="nga ishulli i Qipros e kufijte e Shamit deri ne skajin e Jemenit.">ومن جزيرة قبرص وثغور الشام والعواصم كطرسوس ونحوها إلىٰ أقصىٰ اليمن.</span> <span class="w" data-sq="E çdo femije i tij nuk mori perveçse pak — thuhet: me pak se njëzet dirhem.">وإنما أخذ كل واحد من أولاده من ماله شيئًا يسيرًا يقال: أقل من عشرين درهمًا.</span></span></p>`},

// ===== Faqja 11: (PDF fq. 12) =====
{html:`<p><span class="s" data-sq="Edhe nga Suneti ka tregues se vilajeti (posti drejtues) eshte amanet, ashtu siç tha Pejgamberi ﷺ: «Kur te humbet amaneti, prite Oren (Kijametin).» I thane: E si humbet amaneti, o i Derguar i Allahut? Tha: «Kur t'ua besohet çeshtja atyre qe nuk jane te denje per te, prite Oren.» — e transmetoi Buhariu."><span class="w" data-sq="Edhe nga Suneti ka tregues se vilajeti (posti drejtues) eshte amanet,">وقد دلت السنة على أن الولاية أمانة،</span> <span class="w" data-sq="ashtu siç tha Pejgamberi ﷺ: «Kur te humbet amaneti, prite Oren.» I thane: E si humbet amaneti? Tha: «Kur t'ua besohet çeshtja atyre qe nuk jane te denje, prite Oren.»">كما قال النبي ﷺ: «إذا ضُيِّعت الأمانة فانتظر الساعة». قالوا: كيف إضاعتها يا رسول الله؟ قال: «إذا وُسِّد الأمرُ إلىٰ غير أهله فانتظر الساعة».</span> <span class="w" data-sq="e transmetoi Buhariu.">رواه البخاري.</span></span></p>

<p><span class="s hadith" data-sq="Dhe tha ﷺ: «Secili prej jush eshte bari, dhe secili eshte pergjegjes per grigjen e tij.»"><span class="w" data-sq="Secili prej jush eshte bari, dhe secili eshte pergjegjes per grigjen e tij.">«كلكم راعٍ، وكلكم مسؤول عن رعيته».</span></span></p>

<p><span class="s" data-sq="Dhe tha ﷺ per bariun (udheheqesin) qe nuk i keshillon grigjes se tij: «Nuk e nuhat eren e Xhenetit.»"><span class="w" data-sq="Dhe tha ﷺ per bariun qe nuk i keshillon grigjes se tij: «Nuk e nuhat eren e Xhenetit.»">وقال ﷺ في الراعي الذي يغش رعيته: «لا يجد رائحة الجنة».</span></span></p>

<p><span class="s" data-sq="Ebu Muslim el-Havlani shkoi te Muaviju, Allahu qofte i kenaqur me te, e i tha: Paqe mbi ty, o puntori (i punesuar). Nuk i tha: o mbreti. E dikush tha: Le te thote: Paqe mbi ty, o emiri i besimtareve. Tha: Lini ta thote si te doje. Ai e njeh me mire veten e tij. E pastaj Ebu Muslimi tha: Ti je vetem si ai qe largohet per te fituar duke lene devenë ne shtepine e nje tjeterit, nese nuk i kujdeset deveve, do te pyetesh per to."><span class="w" data-sq="Ebu Muslim el-Havlani shkoi te Muaviju e i tha: Paqe mbi ty, o puntori.">وقد دخل أبو مسلم الخولاني علىٰ معاوية رضي الله عنه فقال: السلام عليك أيها الأجير.</span> <span class="w" data-sq="Nuk i tha: o mbreti. Dikush tha: Le te thote o emiri i besimtareve. Tha: Lini, ai e njeh me mire veten e tij.">ولم يقل: أيها الأمير. فقال بعضهم: ليقل: السلام عليك أيها الأمير. فقال: دعوه فإنه أعلم بما يقول.</span> <span class="w" data-sq="Pastaj Ebu Muslimi tha: Ti je vetem nje puntor i punesuar — pronarit te ketyre deleve ta ka dhene per t'i ruajtur.">ثم قال أبو مسلم: إنما أنت أجير استأجرك ربُّ هذه الغنم لرعايتها،</span> <span class="w" data-sq="Nese ua lyeve zhgarën te zgjeburave, ua sherove te semureve, i mbajte te parat per te fundit, pronarit te paguajke.">فإن أنت هَنَأْتَ جرباها، وداويتَ مرضاها، وحبست أولاها على أُخراها وفَّاك سيدُها أجرَك،</span> <span class="w" data-sq="E nese nuk ua lyeve zhgarën, nuk ua sherove semundjen, e nuk i mbajte te parat per te fundit —">وإن أنت لم تَهْنَأ جرباها، ولم تداو مرضاها، ولم تحبس أولاها على</span></span></p>`},

// ===== Faqja 12: (PDF fq. 14) =====
{html:`<p><span class="s" data-sq="pronarit te ndeshkojke."><span class="w" data-sq="pronarit te ndeshkojke.">أخراها عاقبك سَيِّدُها.</span></span></p>

<p><span class="s" data-sq="Kjo eshte e qarte per t'u marre parasysh: krijesat jane roberit e Allahut, e drejtuesit jane zevendesit e Allahut mbi roberit e Tij, dhe ata jane perfaqesuesit e roberve mbi veten e tyre, ne poziten e njerit nga dy ortaket me tjetrin — andaj ne ta ka kuptimin e vilajettit (drejtimit) dhe te perfaqesimit."><span class="w" data-sq="Kjo eshte e qarte per t'u marre parasysh:">وهذا ظاهر الاعتبار،</span> <span class="w" data-sq="krijesat jane roberit e Allahut, e drejtuesit jane zevendesit e Allahut mbi roberit e Tij,">فإن الخلقَ عبادُ الله، والولاة نُوَّاب الله على عباده،</span> <span class="w" data-sq="dhe ata jane perfaqesuesit e roberve mbi veten e tyre, ne poziten e njerit nga dy ortaket me tjetrin —">وهم وكلاء العباد على نفوسهم، بمنزلة أحد الشريكين مع الآخر،</span> <span class="w" data-sq="andaj ne ta ka kuptimin e vilajettit dhe te perfaqesimit.">ففيهم معنىٰ الولاية والوكالة.</span></span></p>

<p><span class="s" data-sq="Pastaj, drejtuesi dhe perfaqesuesi, kur zevendeson ne punet e tij nje njeri dhe le ate qe eshte me i pershtatshmi"><span class="w" data-sq="Drejtuesi dhe perfaqesuesi, kur zevendeson ne punet e tij nje njeri dhe le ate qe eshte me i pershtatshmi">ثم الوليُّ والوكيل متى استناب في أموره رجلًا وترك مَن هو أصلح</span></span></p>`},

// ===== Faqja 13: (PDF fq. 15) =====
{html:`<p><span class="s" data-sq="per tregti apo prone, apo e shet mallin me nje çmim nderkohe qe gjen kend e blen me çmim me te mire — ka tradhetuar pronarin. Sidomos nese mes tij dhe atij qe e favorizoi ka dashuri apo farefisnise — pronari i tij e urrën, e qorton, dhe mendon se ai e ka tradhetuar dhe ka lajkatuar te afërmin apo mikun e vet."><span class="w" data-sq="per tregti apo prone, apo e shet mallin me nje çmim nderkohe qe gjen kend e blen me çmim me te mire — ka tradhetuar pronarin.">للتجارة أو العقار منه، أو باع السلعة بثمن، وهو يجد من يشتريها بخير من ذلك الثمن، فقد خان صاحبه،</span> <span class="w" data-sq="Sidomos nese mes tij dhe atij qe e favorizoi ka dashuri apo farefisnise — pronari e urrën, e qorton, dhe mendon se e ka tradhetuar.">لاسيما إن كان بينه وبين مَن حاباه مودة أو قربة، فإن صاحبه يبغضه ويذمّه، ويرى أنه قد خانه وداهن قريبَه أو صديقَه.</span></span></p>

<span class="fasl">فصل</span>

<p><span class="s" data-sq="Kur te dihet kjo, mbi te nuk eshte te punesoje perveçse me te pershtatshmin e gjendur, dhe mund te mos jete ne dispozicion i tij ai qe eshte me i pershtatshmi per ate post. Andaj zgjedh me te mirin e me te mirin ne çdo post sipas permasave te tij."><span class="w" data-sq="Kur te dihet kjo, mbi te nuk eshte te punesoje perveçse me te pershtatshmin e gjendur,">إذا عُرِفَ هذا فليس عليه أن يستعمل إلا أصلح الموجود،</span> <span class="w" data-sq="dhe mund te mos jete ne dispozicion i tij ai qe eshte me i pershtatshmi per ate post.">وقد لا يكون في موجوده مَن هو أصلح لتلك الولاية،</span> <span class="w" data-sq="Andaj zgjedh me te mirin e me te mirin ne çdo post sipas permasave te tij.">فيختار الأمثل فالأمثل في كل منصبِ بحسبه.</span></span> <span class="s" data-sq="Nese e ben kete pas perpjekjes se plote, dhe e merr postin me te drejten e tij, ka dorezuar amanetin, ka kryer obligimin ne kete, dhe behet ne keto çeshtje nga imamet e drejtesise dhe barazise te Allahut."><span class="w" data-sq="Nese e ben kete pas perpjekjes se plote, dhe e merr postin me te drejten e tij,">وإذا فعل ذلك بعد الاجتهاد التام، وأُخِذه للولاية بحقها،</span> <span class="w" data-sq="ka dorezuar amanetin, ka kryer obligimin, dhe behet nga imamet e drejtesise te Allahut.">فقد أدى الأمانة، وقام بالواجب في هذا، وصار في هذه المواضع من أئمة العدل والمقسطين عند الله.</span></span></p>

<p><span class="s" data-sq="Edhe nese disa çeshtje prishen per shkak te tjereve kur nuk ka mundesi tjeter, Allahu i Lartesuar thote: «Kini frike Allahun sa te mundeni» [Et-Tegabun: 16], dhe tha: «All-llahu nuk e ngarkon askënd përtej mundësive të veta» [El-Bekare: 286], dhe tha ne Xhihad: «Allahu nuk te ngarkon perveçse veten tende, e nxiti besimtaret» [En-Nisa: 84], dhe tha: «O ju që besuat, ruajeni veten tuaj! Ai që ka humbur, nuk ju dëmton juve kur jeni në rrugë të drejtë» [El-Maide: 105]."><span class="w" data-sq="Edhe nese disa çeshtje prishen per shkak te tjereve kur nuk ka mundesi tjeter,">وإن اختلّت بعضُ الأمور بسبب من غيره إذا لم يمكن إلا ذلك،</span> <span class="w" data-sq="Allahu thote: «Sa të keni mundësi ruajuni prej dënimit të All-llahut»">فإن الله سبحانه وتعالى يقول: ﴿فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ﴾ [التغابن: ١٦]،</span> <span class="w" data-sq="«All-llahu nuk e ngarkon askënd përtej mundësive të veta»">وقال عز وجل: ﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا﴾ [البقرة: ٢٨٦]،</span> <span class="w" data-sq="«Allahu nuk te ngarkon perveçse veten tende, e nxiti besimtaret»">وقال جل جلاله في الجهاد: ﴿يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا نَفْسَكَ وَحَرِّضِ الْمُؤْمِنِينَ﴾ [النساء: ٨٤]،</span> <span class="w" data-sq="«O ju që besuat, ruajeni veten tuaj! Ai që ka humbur, nuk ju dëmton juve kur jeni në rrugë të drejtë»">وقال عز وجل: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا عَلَيْكُمْ أَنفُسَكُمْ لَا يَضُرُّكُم مَّن ضَلَّ إِذَا اهْتَدَيْتُمْ﴾ [المائدة: ١٠٥].</span></span></p>

<p><span class="s" data-sq="Kush e kryen obligimin e mundur eshte i udhezuar. Dhe tha Pejgamberi ﷺ: «Kur t'ju urdhëroj me diçka, beni prej saj çka mundeni.»"><span class="w" data-sq="Kush e kryen obligimin e mundur eshte i udhezuar.">فمن أدى الواجبَ المقدورَ عليه فقد اهتدى،</span> <span class="w" data-sq="Dhe tha Pejgamberi ﷺ: «Kur t'ju urdhëroj me diçka, beni prej saj çka mundeni.»">وقال النبي ﷺ: «إذا</span></span></p>`},

// ===== Faqja 14: Dy shtyllat: Fuqia dhe Amaneti (PDF fq. 16) =====
{html:`<p><span class="s hadith" data-sq="t'ju urdhëroj me diçka, beni prej saj çka mundeni.» — e nxoren ne 'Dy Sahihet'; por nese ka pasur paaftësi pa nevoje apo tradhtia, ndeshkohet per kete."><span class="w" data-sq="t'ju urdhëroj me diçka, beni prej saj çka mundeni.» — e nxoren ne 'Dy Sahihet';">أمرتكم بأمر فأتوا منه ما استطعتم». أخرجاه في «الصحيحين»،</span> <span class="w" data-sq="por nese ka pasur paaftësi pa nevoje apo tradhtia, ndeshkohet per kete.">لكن إن كان منه عجزٌ بلا حاجة إليه أو خيانة عوقب على ذلك.</span></span></p>

<p><span class="s" data-sq="Duhet te dijë me te pershtatshmin ne çdo post, sepse vilajeti (posti drejtues) ka dy shtylla: fuqine dhe amanetin, siç tha i Lartesuari: «Më i miri i atij që do ta marrësh në shërbim është ai i fuqishmi e besniku!» [El-Kasas: 26]. Dhe i tha pronari i Egjiptit Jusufit, paqja qofte mbi te: «Ti sot tek ne je i ngritur ne pozite, besnik» [Jusuf: 54]. Dhe tha i Lartesuari per cilesine e Xhibrilit, paqja qofte mbi te: «Vertet, eshte fjala e nje te derguari fisnik, te fuqishem, me pozite tek Pronari i Arshit, te bindur, besnik» [Et-Tekvir: 19-21]."><span class="w" data-sq="Duhet te dijë me te pershtatshmin ne çdo post, sepse vilajeti ka dy shtylla: fuqine dhe amanetin,">وينبغي أن يعرف الأصلح في كل منصب، فإن الولاية لها ركنان: القوة، والأمانة،</span> <span class="w" data-sq="siç tha i Lartesuari: «Më i miri i atij që do ta marrësh në shërbim është ai i fuqishmi e besniku!»">كما قال تعالى: ﴿إِنَّ خَيْرَ مَنِ اسْتَأْجَرْتَ الْقَوِيُّ الْأَمِينُ﴾ [القصص: ٢٦]،</span> <span class="w" data-sq="Dhe i tha pronari i Egjiptit Jusufit: «Tash ti ke te na pozitë dhe je i besueshëm»">وقال صاحب مصر ليوسف عليه الصلاة والسلام: ﴿إِنَّكَ الْيَوْمَ لَدَيْنَا مَكِينٌ أَمِينٌ﴾ [يوسف: ٥٤]،</span> <span class="w" data-sq="Dhe tha i Lartesuari per Xhibrilin: «S'ka dyshim se ai është thënie e të dërguarit fisnik, që është i fortë dhe që ka vend të lartë te Zoti i Arshit, që është i respektuar atje dhe besnik»">وقال تعالى في صفة جبريل عليه السلام: ﴿إِنَّهُ لَقَوْلُ رَسُولٍ كَرِيمٍ ❊ ذِي قُوَّةٍ عِندَ ذِي الْعَرْشِ مَكِينٍ ❊ مُّطَاعٍ ثَمَّ أَمِينٍ﴾ [التكوير: ١٩-٢١].</span></span></p>

<p><span class="s" data-sq="Fuqia ne çdo post eshte sipas natyres se tij: fuqia ne komandimin e luftes kthehet te guximshmëria e zemres, njohja e lufterave dhe dredhi ne to — ngase lufta eshte dredhia — pastaj aftësia ne llojet e luftimit: gjuajtje, goditje, kalorësi, sulm e terhëqje etj., siç tha i Lartesuari: «E ju përgatituni sa të keni mundësi force, e kuaj të caktuar për betejë» [El-Enfal: 60]."><span class="w" data-sq="Fuqia ne çdo post eshte sipas natyres se tij:">والقوة في كل ولاية بحسبها،</span> <span class="w" data-sq="fuqia ne komandimin e luftes kthehet te guximshmëria, njohja e lufterave dhe dredhi ne to — ngase lufta eshte dredhia —">فالقوة في إمارة الحرب ترجع إلى شجاعة القلب، وإلى الخبرة بالحروب، والمخادعة فيها ـ فإن الحرب خدعة ـ</span> <span class="w" data-sq="pastaj aftësia ne llojet e luftimit: gjuajtje, goditje, kalorësi, sulm e terhëqje etj.,">و[إلى] القدرة على أنواع القتال؛ من رمي وطعن وضرب، وركوب وكرٍّ وفرٍّ، ونحو ذلك،</span> <span class="w" data-sq="siç tha i Lartesuari: «E ju përgatituni sa të keni mundësi force, e kuaj të caktuar për betejë»">كما قال تعالى: ﴿وَأَعِدُّوا لَهُم مَّا اسْتَطَعْتُم مِّن قُوَّةٍ وَمِن رِّبَاطِ الْخَيْلِ﴾ [الأنفال: ٦٠].</span></span> <span class="s hadith" data-sq="Dhe tha Pejgamberi ﷺ: «Gjuani e kaleroni, dhe te gjuani eshte me e dashur per mua sesa te kaleroni. Kush e mesoi gjuajtjen pastaj e harroi, nuk eshte prej nesh.»"><span class="w" data-sq="«Gjuani e kaleroni, dhe te gjuani eshte me e dashur per mua sesa te kaleroni. Kush e mesoi gjuajtjen pastaj e harroi, nuk eshte prej nesh.»">وقال النبي ﷺ: «ارموا واركبوا، وأن ترموا أحبُّ إليَّ من أن تركبوا، ومَن تعلَّم الرميَ ثم نسيه فليس منّا».</span></span></p>`},

// ===== Faqja 15: Fuqia ne gjykim, Amaneti (PDF fq. 17) =====
{html:`<p><span class="s hadith" data-sq="Ne nje transmetim tjeter: «Eshte nje mirësi qe e ka mohuar» — e transmetoi Muslimi."><span class="w" data-sq="Ne nje transmetim tjeter: «Eshte nje mirësi qe e ka mohuar» — e transmetoi Muslimi.">رواية: «فهي نعمةٌ جَحَدها» رواه مسلم.</span></span></p>

<p><span class="s" data-sq="Fuqia ne gjykimin mes njerezve kthehet te dija per drejtesine qe e tregon Libri dhe Suneti, dhe te aftësia per te zbatuar dispozitat."><span class="w" data-sq="Fuqia ne gjykimin mes njerezve kthehet te dija per drejtesine qe e tregon Libri dhe Suneti,">والقوة في الحكم بين الناس ترجع إلى العلم بالعدل الذي دل عليه الكتاب والسنة،</span> <span class="w" data-sq="dhe te aftësia per te zbatuar dispozitat.">وإلى القدرة على تنفيذ الأحكام.</span></span></p>

<p><span class="s" data-sq="Amaneti kthehet te frika ndaj Allahut te Lartesuar, lenia e frikes ndaj njerezve, dhe mosshitja e ajeteve te Tij per nje çmim te ulet. Keto jane tre cilesit qe Allahu ia ka marre zotimin çdo gjykuesi mbi njerezit ne fjalen e Te Lartit: «Mos u frikësoni njerëzve, por frikësomuni Mua, dhe mos i shisni argumentet e Mia me një vlerë të pakët, e kush nuk gjykon me atë që e zbriti All-llahu, ata janë mohuesit.» [El-Maide: 44]"><span class="w" data-sq="Amaneti kthehet te frika ndaj Allahut te Lartesuar, lenia e frikes ndaj njerezve,">والأمانة ترجع إلى خشية الله تعالى وترك خشية الناس،</span> <span class="w" data-sq="dhe mosshitja e ajeteve te Tij per nje çmim te ulet.">وألا يشتري بآياته ثمنًا قليلًا،</span> <span class="w" data-sq="Keto jane tre cilesit qe Allahu ia ka marre çdo gjykuesi mbi njerezit ne fjalen e Te Lartit:">وهذه الخصال الثلاث التي أخذها الله على كل مَن حَكَم على الناس في قوله تعالى:</span> <span class="w" data-sq="«Mos u frikësoni njerëzve, por frikësomuni Mua, dhe mos i shisni argumentet e Mia me një vlerë të pakët, e kush nuk gjykon me atë që e zbriti All-llahu, ata janë mohuesit.»">﴿فَلَا تَخْشَوُا النَّاسَ وَاخْشَوْنِ وَلَا تَشْتَرُوا بِآيَاتِي ثَمَنًا قَلِيلًا وَمَن لَّمْ يَحْكُم بِمَا أَنزَلَ اللَّهُ فَأُولَٰئِكَ هُمُ الْكَافِرُونَ﴾</span> [المائدة: ٤٤].</span></p>

<p><span class="s hadith" data-sq="Prandaj tha Pejgamberi ﷺ: «Gjyqtaret jane tre: dy ne Zjarr e nje ne Xhenet. Njeri e njohu te verteten e gjykoi kundershtazi — ai eshte ne Zjarr. Njeri gjykoi mes njerezve me padije — ai eshte ne Zjarr. E njeri e diti te verteten e gjykoi me te — ai eshte ne Xhenet.» — e transmetuan autoret e Suneneve."><span class="w" data-sq="Prandaj tha Pejgamberi ﷺ: «Gjyqtaret jane tre: dy ne Zjarr e nje ne Xhenet.">ولهذا قال النبي ﷺ: «القضاة ثلاثة: قاضيان في النار وقاضٍ في الجنة.</span> <span class="w" data-sq="Njeri e njohu te verteten e gjykoi kundershtazi — ai eshte ne Zjarr.">فرجلٌ عرفَ الحقَّ وقضى بخلافه فهو في النار،</span> <span class="w" data-sq="Njeri gjykoi mes njerezve me padije — ai eshte ne Zjarr.">ورجلٌ قضى للناس على جهل فهو في النار،</span> <span class="w" data-sq="E njeri e diti te verteten e gjykoi me te — ai eshte ne Xhenet.»">ورجلٌ علمَ الحقَّ وقضى به فهو في الجنة»</span> <span class="w" data-sq="e transmetuan autoret e Suneneve.">رواه أهل السنن.</span></span></p>`},

// ===== Faqja 16: Kadi, Fasl: Fuqia+Amaneti bashke (PDF fq. 18) =====
{html:`<p><span class="s" data-sq="Gjyqtari (kadi) eshte emer per çdokend qe gjykon mes dy vetave, qofte i quajtur halife, sulltan, zevendes apo drejtues, apo i emeruar per te gjykuar me sheriatin, apo zevendes i tij, madje edhe ai qe gjykon mes djemve ne vizatime kur zgjedhin. Keshtu e permenden shoket e te Derguarit te Allahut ﷺ, dhe kjo eshte e qarte."><span class="w" data-sq="Gjyqtari eshte emer per çdokend qe gjykon mes dy vetave, qofte i quajtur halife, sulltan, zevendes apo drejtues,">فالقاضي اسمٌ لكل مَن حكم بين اثنين، سواء سُمِّي خليفةً أو سلطانًا أو نائبًا أو واليًا،</span> <span class="w" data-sq="apo i emeruar per te gjykuar me sheriatin, apo zevendes i tij, madje edhe ai qe gjykon mes djemve ne vizatime kur zgjedhin.">أو كان منصوبًا ليقضي بالشرع، أو نائبًا له، حتى مَن يحكم بين الصبيان في الخطوط إذا تخايروا.</span> <span class="w" data-sq="Keshtu e permenden shoket e te Derguarit te Allahut ﷺ, dhe kjo eshte e qarte.">هكذا ذكر أصحابُ رسول الله ﷺ، وهو ظاهر.</span></span></p>

<span class="fasl">فصل</span>

<p><span class="s" data-sq="Bashkimi i fuqise dhe amanetit te njerezit eshte i rralle; prandaj Umer ibnu'l-Hatabi, Allahu qofte i kenaqur me te, thoshte: O Allah, te ankohem per palodhshmerine e keqberesit dhe paaftesine e besnikut."><span class="w" data-sq="Bashkimi i fuqise dhe amanetit te njerezit eshte i rralle;">اجتماع القوة والأمانة في الناس قليل؛</span> <span class="w" data-sq="prandaj Umer ibnu'l-Hatabi, Allahu qofte i kenaqur me te, thoshte:">ولهذا كان عمر بن الخطاب رضي الله عنه يقول:</span> <span class="w" data-sq="O Allah, te ankohem per palodhshmerine e keqberesit dhe paaftesine e besnikut.">اللهم إليك أشكو جَلَدَ الفاجر وعجز الثقة.</span></span></p>

<p><span class="s" data-sq="Obligimi ne çdo post eshte me i pershtatshmi sipas permasave te tij. Nese dalin dy veta, njeri me besnik e tjetri me i forte, parapelqehet me i dobishmi per ate post dhe me pak i demshmi ne te."><span class="w" data-sq="Obligimi ne çdo post eshte me i pershtatshmi sipas permasave te tij.">فالواجب في كل ولاية الأصلح بحسبها،</span> <span class="w" data-sq="Nese dalin dy veta, njeri me besnik e tjetri me i forte, parapelqehet me i dobishmi per ate post dhe me pak i demshmi ne te.">فإذا عُيِّن رجلان أحدهما أعظم أمانة والآخر أعظم قوة، قُدِّم أنفعهما لتلك الولاية، وأقلهما ضررًا فيها،</span></span> <span class="s" data-sq="Ne komandimin e luftes parapelqehet njeriu i forte e guximtar — edhe nese ka keqberësi — mbi njeriun e dobet te paaftë edhe nese eshte besnik. Siç u pyet Imam Ahmedi per dy veta qe jane komandante ne lufte, njeri i forte keqberes e tjetri"><span class="w" data-sq="Ne komandimin e luftes parapelqehet njeriu i forte e guximtar — edhe nese ka keqberësi — mbi njeriun e dobet te paaftë edhe nese eshte besnik.">فيُقَدَّم في إمارة الحروب الرجل القويّ الشجاع ـ وإن كان فيه فجور ـ على الرجل الضعيف العاجز وإن كان أمينًا،</span> <span class="w" data-sq="Siç u pyet Imam Ahmedi per dy veta qe jane komandante ne lufte, njeri i forte keqberes e tjetri">كما سئل الإمام أحمد عن الرجلين يكونان أميرين في الغزو، وأحدهما قويٌّ فاجر والآخر</span></span></p>`},

// ===== Faqja 17: I forti keqberes vs i dobeti besnik (PDF fq. 19) =====
{html:`<p><span class="s" data-sq="i dobet i mire — me cilin prej tyre luftohet? Tha: Sa per keqberesin e forte — fuqia e tij eshte per muslimanet dhe keqberësia e tij eshte mbi veten e tij. Kurse i miri i dobet — mirësia e tij eshte per veten e tij dhe dobësia e tij eshte mbi muslimanet. Luftohet me te fortin keqberes."><span class="w" data-sq="i dobet i mire — me cilin prej tyre luftohet?">ضعيف صالح، مع أيهما يُغْزَى؟</span> <span class="w" data-sq="Tha: Sa per keqberesin e forte — fuqia e tij eshte per muslimanet dhe keqberësia mbi veten e tij. Kurse i miri i dobet — mirësia per veten e tij dhe dobësia mbi muslimanet. Luftohet me te fortin keqberes.">فقال: أما الفاجر القوي فقوته للمسلمين وفجوره على نفسه، وأما الصالح الضعيف فصلاحه لنفسه وضعفه على المسلمين، يُغْزَى مع القوي الفاجر.</span></span></p>

<p><span class="s hadith" data-sq="Dhe ka thene Pejgamberi ﷺ: «Vertet, Allahu e perforçon kete fe me njeriun keqberes.» Dhe eshte transmetuar: «Me popuj qe nuk kane hise (ne boten tjeter).»"><span class="w" data-sq="Dhe ka thene Pejgamberi ﷺ: «Vertet, Allahu e perforçon kete fe me njeriun keqberes.»">وقد قال النبي ﷺ: «إن الله يؤيد هذا الدين بالرجل الفاجر»،</span> <span class="w" data-sq="Dhe eshte transmetuar: «Me popuj qe nuk kane hise.»">وروي: «بأقوام لا خلاق لهم»،</span></span> <span class="s" data-sq="Nese feja nuk mbahet me njeriun keqberes — nese eshte keqberes — ai eshte me meritor per komandimin e luftes sesa ai qe eshte me i mire se ai ne fe kur nuk ia ze vendin."><span class="w" data-sq="Nese feja nuk mbahet me njeriun keqberes, ai eshte me meritor per komandimin e luftes sesa ai qe eshte me i mire ne fe kur nuk ia ze vendin.">فإذا لم يكن الدين بالرجل الفاجر فاجرًا كان أولى بإمارة الحرب ممن هو أصلح منه في الدين إذا لم يسدّ مسدّه.</span></span></p>

<p><span class="s" data-sq="Prandaj Pejgamberi ﷺ e punesonte Halid ibnu'l-Velidin ne lufte qe kur u be musliman, dhe tha: «Vertet, Halidi eshte nje shpate qe Allahu e ka terhequr kundër idhujtareve.»"><span class="w" data-sq="Prandaj Pejgamberi ﷺ e punesonte Halid ibnu'l-Velidin ne lufte qe kur u be musliman,">ولهذا كان النبي ﷺ يستعمل خالدَ بنَ الوليد على الحرب منذ أسلم،</span> <span class="w" data-sq="dhe tha: «Vertet, Halidi eshte nje shpate qe Allahu e ka terhequr kundër idhujtareve.»">وقال: «إن خالدًا سيفٌ سلَّه الله على المشركين».</span></span></p>`},

// ===== Faqja 18: Halidi + Ebu Dherri (PDF fq. 20) =====
{html:`<p><span class="s" data-sq="Nderkohe qe ai bente gjera qe Pejgamberi ﷺ nuk i miratonte, madje njehere ngriti duart e tij drejt qiellit e tha: «O Allah, une te deklaroj pafajesi nga ajo qe beri Halidi» — kur e dergoi te Xhedhime, e ai i vrau ata e mori pasurite e tyre me nje interpretim te pasakte, e kjo nuk ishte e lejuar. Disa nga sahabet qe ishin me te e kundershtuan. Pejgamberi ﷺ ua pagoi gjakun dhe ua garanton pasurite e tyre. E megjithate vazhdoi ta parapelqente ne komandimin e luftes — ngase ishte me i pershtatshmi ne kete fushe sesa kushdo tjeter, dhe ajo qe beri e beri me nje interpretim."><span class="w" data-sq="Nderkohe qe ai bente gjera qe Pejgamberi ﷺ nuk i miratonte, madje njehere ngriti duart e tha: «O Allah, te deklaroj pafajesi nga ajo qe beri Halidi»">يعمل ما ينكره النبي ﷺ، حتى إنه مرةً رفع يديه إلى السماء وقال: «اللهم إني أبرأ إليك مما فَعَل خالد»</span> <span class="w" data-sq="kur e dergoi te Xhedhime, e ai i vrau e mori pasurite e tyre me nje interpretim, e kjo nuk ishte e lejuar.">لما أرسله إلى جَذِيمة، فقتلهم وأخذ أموالهم بنوع شبهة، ولم يكن يُجَوِّز ذلك،</span> <span class="w" data-sq="Disa sahabe e kundershtuan. Pejgamberi ﷺ ua pagoi gjakun e ua garanton pasurite.">وأنكره عليه بعض مَن كان معه من الصحابة، حتى وَدَاهم النبي ﷺ وضمن أموالهم.</span> <span class="w" data-sq="E megjithate vazhdoi ta parapelqente ne komandimin e luftes — ngase ishte me i pershtatshmi, dhe ajo qe beri e beri me nje interpretim.">ومع هذا فما زال يقدِّمه في إمارة الحرب؛ لأنه كان أصلح في هذا الباب من غيره، وفَعَل ما فَعَله بنوع تأويل.</span></span></p>

<p><span class="s" data-sq="Ebu Dherri, Allahu qofte i kenaqur me te, ishte me i pershtatshmi se ai ne besnikeri e sinqeritet; e megjithate Pejgamberi ﷺ i tha: «O Ebu Dherr, une te shoh te dobet, dhe une dua per ty ate qe dua per veten time: mos u be komandant mbi dy veta, e mos u be drejtues i pasurise se jetimit.» — e transmetoi Muslimi. E ndaloi Ebu Dherrin nga komandiminere dhe drejtimi ngase e pa te dobet."><span class="w" data-sq="Ebu Dherri ishte me i pershtatshmi se ai ne besnikeri e sinqeritet; e megjithate Pejgamberi ﷺ i tha:">وكان أبو ذر رضي الله عنه أصلح منه في الأمانة والصدق، ومع هذا فقال له النبي ﷺ:</span> <span class="w" data-sq="«O Ebu Dherr, une te shoh te dobet, dhe dua per ty ate qe dua per veten time: mos u be komandant mbi dy veta, e mos u be drejtues i pasurise se jetimit.»">«يا أبا ذر إني أراك ضعيفًا، وإني أحبُّ لك ما أحبُّ لنفسي، لا تأمَّرَنَّ على اثنين، ولا تَوَلَّيَنَّ مالَ يتيم»</span> <span class="w" data-sq="e transmetoi Muslimi. E ndaloi nga komandimi ngase e pa te dobet.">رواه مسلم. ونهى أبا ذر عن الإمارة والولاية لأنه رآه ضعيفًا.</span></span> <span class="s hadith" data-sq="Megjithese eshte transmetuar: «Nuk ka hije qielli e as nuk ka mbartur toka njeri me te sinqerte ne fjale sesa Ebu Dherri.»"><span class="w" data-sq="«Nuk ka hije qielli e as nuk ka mbartur toka njeri me te sinqerte ne fjale sesa Ebu Dherri.»">مع أنه قد رُوي: «ما أظلَّت الخضراءُ ولا أقلَّت الغَبْراء أصدقُ لهجةً من أبي ذر».</span></span></p>`},

// ===== Faqja 19: Amr ibnu'l-As, Usame, Ebu Bekri (PDF fq. 21) =====
{html:`<p><span class="s" data-sq="Pejgamberi ﷺ njehere e emeroi Amr ibnu'l-Asin ne betejën Dhat es-Selasil — per te fituar dashurine e te afermeve te tij tek te cilet e dergoi — mbi ata qe ishin me te mire se ai. Dhe e emeroi Usame ibnu Zejdin per te marre hakun e babait te tij. Gjithashtu e punesonte njeriun per nje dobi mbizoteruse, edhe pse me emirin kishte kend me te mire ne dije e besim."><span class="w" data-sq="Pejgamberi ﷺ njehere e emeroi Amr ibnu'l-Asin ne betejën Dhat es-Selasil — per te fituar dashurine e te afermeve te tij — mbi ata qe ishin me te mire se ai.">وأمَّرَ النبيُّ ﷺ مرةً عَمْرو بن العاص في غزوة ذات السلاسل ـ استعطافًا لأقاربه الذين بعثه إليهم ـ على مَن هو أفضل منه.</span> <span class="w" data-sq="Dhe e emeroi Usame ibnu Zejdin per te marre hakun e babait te tij.">وأمَّر أسامة بن زيد لأجل طلب ثأر أبيه.</span> <span class="w" data-sq="Gjithashtu e punesonte njeriun per nje dobi mbizoteruse, edhe pse me emirin kishte kend me te mire ne dije e besim.">وكذلك كان يستعمل الرجل لمصلحة راجحة، مع أنه قد كان يكون مع الأمير مَن هو أفضل منه في العلم والإيمان.</span></span></p>

<p><span class="s" data-sq="Keshtu edhe Ebu Bekri, halifja i te Derguarit te Allahut ﷺ, Allahu qofte i kenaqur me te, vazhdoi ta punesonte Halidin ne luftën kundër renegateve, ne çlirimet e Irakut e te Shamit, e prej tij dolën gabime qe ai i interpretonte ndryshe. Nuk e shkarkoi per to, por e qortoi. Ngase askush tjeter nuk do t'ia zinte vendin per shkak mbizoterimit te dobise ndaj demit ne qendrimin e tij."><span class="w" data-sq="Keshtu edhe Ebu Bekri, halifja i te Derguarit, Allahu qofte i kenaqur me te, vazhdoi ta punesonte Halidin ne luftën kundër renegateve, ne çlirimet e Irakut e te Shamit,">وهكذا كان أبو بكر خليفة رسول الله ﷺ رضي الله عنه ما زال يستعمل خالدًا في حرب أهل الرِّدَّة، وفي فتوح العراق والشام،</span> <span class="w" data-sq="e prej tij dolën gabime qe ai i interpretonte ndryshe. Nuk e shkarkoi per to, por e qortoi.">وبَدَت منه هفوات كان له فيها تأويل، وقد ذُكِر له عنه أنه كان له فيها هوى، فلم يعزِله من أجلها، بل عَتَبَه</span> <span class="w" data-sq="Ngase askush tjeter nuk do t'ia zinte vendin per shkak mbizoterimit te dobise ndaj demit ne qendrimin e tij.">وأن غيره لم يكن يقوم عليها لرجحان المصلحة على المفسدة في بقائه،</span></span></p>

<p><span class="s" data-sq="Sepse kur udheheqesi i larte ka natyren qe priret nga ashpersia, duhet qe natyra e zevendesit te tij te priret nga buta. E kur natyra e tij priret nga buta, duhet qe natyra e zevendesit te priret nga ashpersia — qe çeshtja te jete e ekuilibruar."><span class="w" data-sq="Kur udheheqesi i larte ka natyren qe priret nga ashpersia, duhet qe natyra e zevendesit te priret nga buta.">لأن المتولي الكبير إذا كان خُلُقُه يميل إلى الشِّدَّة، فينبغي أن يكون خُلُق نائبه يميل إلى اللين،</span> <span class="w" data-sq="E kur natyra e tij priret nga buta, duhet qe natyra e zevendesit te priret nga ashpersia — qe çeshtja te jete e ekuilibruar.">وإذا كان خُلُقُه يميل إلى اللين، فينبغي أن يكون خلق نائبه يميل إلى الشدة، ليعتدل الأمر.</span></span></p>`},

// ===== Faqja 20: Ebu Bekri e Umeri — ekuilibri (PDF fq. 21-22) =====
{html:`<p><span class="s" data-sq="Prandaj Ebu Bekri es-Siddiku, Allahu qofte i kenaqur me te, parapelqente zevendesimin e Halidit; kurse Umer ibnu'l-Hatabi, Allahu qofte i kenaqur me te, parapelqente shkarkimin e Halidit dhe zevendesimin e Ebu Ubejde ibnu'l-Xherrahut. Ngase Halidi ishte i ashper si Umeri, kurse Ebu Ubejde ishte i bute si Ebu Bekri — andaj me i pershtatshmi per secilin ishte te emeronte kend e emeroi, qe çeshtja te jete e ekuilibruar, e me kete te ishin nga halifet e te Derguarit te Allahut ﷺ qe ishte i ekuilibruar."><span class="w" data-sq="Prandaj Ebu Bekri parapelqente zevendesimin e Halidit;">ولهذا كان أبو بكر الصديق رضي الله عنه يُؤثِر استنابة خالد،</span> <span class="w" data-sq="kurse Umeri parapelqente shkarkimin e Halidit dhe zevendesimin e Ebu Ubejdes;"> وكان عمر بن الخطاب رضي الله عنه يؤثر عزلَ خالد واستنابة أبي عبيدة بن الجراح؛</span> <span class="w" data-sq="Ngase Halidi ishte i ashper si Umeri, kurse Ebu Ubejde ishte i bute si Ebu Bekri —">لأن خالدًا كان شديدًا كعمر، وأبا عبيدة كان ليِّنًا كأبي بكر،</span> <span class="w" data-sq="andaj me i pershtatshmi per secilin ishte te emeronte kend e emeroi, qe çeshtja te jete e ekuilibruar,">فكان الأصلح لكل منهما أن يولي مَن ولاه؛ ليكون أمره معتدلًا،</span> <span class="w" data-sq="e me kete te ishin nga halifet e te Derguarit ﷺ qe ishte i ekuilibruar,">ويكون بذلك من خلفاء رسول الله ﷺ الذي هو معتدل،</span></span></p>

<p><span class="s hadith" data-sq="madje tha i Derguari i Allahut ﷺ: «Une jam Pejgamberi i meshires, une jam Pejgamberi i betejës se madhe.» Dhe tha: «Une jam i qeshmuri, luftetari.» Dhe umeti i tij eshte i mesëm (i ekuilibruar), tha Allahu i Lartesuar per ta:"><span class="w" data-sq="madje tha i Derguari i Allahut ﷺ: «Une jam Pejgamberi i meshires, une jam Pejgamberi i betejës se madhe.»">حتى قال رسول الله ﷺ: «أنا نبيُّ الرحمة، أنا نبيُّ المَلْحَمَة».</span> <span class="w" data-sq="Dhe tha: «Une jam i qeshmuri, luftetari.» Dhe umeti i tij eshte i mesëm, tha Allahu per ta:">وقال: «أنا الضَّحُوك القَتَّال»، وأمته وسط، قال الله تعالى فيهم:</span></span></p>`}
];

let cp=0,mode='sentence',activeEl=null;
const pe=document.getElementById('page'),pn=document.getElementById('pageNum'),pb=document.getElementById('prevBtn'),nb=document.getElementById('nextBtn'),pu=document.getElementById('popup'),pt=document.getElementById('pText'),ov=document.getElementById('overlay'),cb=document.getElementById('closeBtn');

function render(){
const old=pe.querySelector('.page-text');if(old)old.remove();
const d=document.createElement('div');d.className='page-text';
if(mode==='word')d.classList.add('word-mode');
d.innerHTML=pages[cp].html;pe.appendChild(d);pe.scrollTop=0;
pn.textContent=(cp+1)+' / '+pages.length;
pb.disabled=cp===0;nb.disabled=cp===pages.length-1;
hide();
}

function show(el,txt){
if(activeEl)activeEl.classList.remove('active');
activeEl=el;el.classList.add('active');
pt.textContent=txt;pu.classList.add('visible');ov.classList.add('active');
const r=el.getBoundingClientRect(),pw=Math.min(420,window.innerWidth-32);
pu.style.width=pw+'px';
let l=r.left+r.width/2-pw/2;
l=Math.max(16,Math.min(l,window.innerWidth-pw-16));
let t=r.bottom+10;pu.style.transform='';
if(t+120>window.innerHeight){t=r.top-10;pu.style.transform='translateY(-100%)';}
pu.style.left=l+'px';pu.style.top=t+'px';
}

function hide(){pu.classList.remove('visible');ov.classList.remove('active');if(activeEl){activeEl.classList.remove('active');activeEl=null}}

pe.addEventListener('click',e=>{
if(mode==='word'){const w=e.target.closest('.w');if(w&&w.dataset.sq){e.stopPropagation();show(w,w.dataset.sq);return}}
const s=e.target.closest('.s');if(s&&s.dataset.sq){show(s,s.dataset.sq);return}
hide();
});

ov.addEventListener('click',hide);
cb.addEventListener('click',hide);

document.addEventListener('keydown',e=>{
if(e.key==='Escape')hide();
if(e.key==='ArrowLeft'&&cp>0){cp--;render()}
if(e.key==='ArrowRight'&&cp<pages.length-1){cp++;render()}
});

pb.addEventListener('click',()=>{if(cp>0){cp--;render()}});
nb.addEventListener('click',()=>{if(cp<pages.length-1){cp++;render()}});

pn.addEventListener('click',()=>{
if(pn.querySelector('input'))return;
const inp=document.createElement('input');
inp.type='number';inp.min=1;inp.max=pages.length;inp.value=cp+1;
pn.textContent='';pn.appendChild(inp);inp.focus();inp.select();
let done=false;
const go=()=>{
if(done)return;done=true;
const v=parseInt(inp.value,10);
if(!isNaN(v)){cp=Math.max(0,Math.min(pages.length-1,v-1))}
render();
};
inp.addEventListener('keydown',e=>{
e.stopPropagation();
if(e.key==='Enter')go();
if(e.key==='Escape'){done=true;render()}
});
inp.addEventListener('blur',go);
});

document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>{
document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));
b.classList.add('active');mode=b.dataset.mode;
const t=pe.querySelector('.page-text');
if(t)t.classList.toggle('word-mode',mode==='word');
hide();
}));

render();
</script>
